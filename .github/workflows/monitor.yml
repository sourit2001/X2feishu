name: X (Twitter) Monitor

on:
  schedule:
    - cron: '0 * * * *'  # Batch 1
    - cron: '20 * * * *' # Batch 2
    - cron: '40 * * * *' # Batch 3
  workflow_dispatch:      # Allow manual trigger
    inputs:
      batch_index:
        description: 'Account batch to run (0, 1, 2, or all)'
        required: false
        default: '0'
      force_web_feed_test:
        description: 'Force publish the latest web-feed tweet for testing'
        required: false
        default: 'false'

concurrency:
  group: x2feishu-tweet-queue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # Allow script to save progress back to repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show checked out commit
        run: git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select account batch
        env:
          REQUESTED_BATCH: ${{ github.event.inputs.batch_index }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "MONITOR_BATCH_INDEX=${REQUESTED_BATCH:-0}" >> "$GITHUB_ENV"
          elif [ "$SCHEDULE_EXPRESSION" = "20 * * * *" ]; then
            echo "MONITOR_BATCH_INDEX=1" >> "$GITHUB_ENV"
          elif [ "$SCHEDULE_EXPRESSION" = "40 * * * *" ]; then
            echo "MONITOR_BATCH_INDEX=2" >> "$GITHUB_ENV"
          else
            echo "MONITOR_BATCH_INDEX=0" >> "$GITHUB_ENV"
          fi

      - name: Run monitor
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_TABLE_ID: ${{ secrets.BITABLE_TABLE_ID }}
          WEB_FEED_GITHUB_TOKEN: ${{ secrets.WEB_FEED_GITHUB_TOKEN }}
          WEB_FEED_REPO: ${{ vars.WEB_FEED_REPO }}
          WEB_FEED_BRANCH: ${{ vars.WEB_FEED_BRANCH }}
          WEB_FEED_PATH: ${{ vars.WEB_FEED_PATH }}
          WEB_FEED_BLOGGERS: ${{ vars.WEB_FEED_BLOGGERS }}
          WEB_FEED_USERNAMES: ${{ vars.WEB_FEED_USERNAMES }}
          WEB_FEED_LIMIT: ${{ vars.WEB_FEED_LIMIT }}
          FORCE_WEB_FEED_TEST: ${{ github.event.inputs.force_web_feed_test }}
          MONITOR_BATCH_COUNT: '3'
          FETCH_INTERVAL_MIN_SECONDS: '3'
          FETCH_INTERVAL_MAX_SECONDS: '7'
          PYTHONUNBUFFERED: '1'
        run: python main.py

      - name: Commit and push if changed
        if: github.event.inputs.force_web_feed_test != 'true'
        timeout-minutes: 3
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add last_ids.json daily_tweets.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update last processed IDs"
          git pull --rebase
          git push
